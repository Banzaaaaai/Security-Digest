name: SecDigest checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --python 3.12 --group dev
      - run: uv run ruff check src tests scripts
      - run: uv run ruff format --check src tests scripts
      - run: uv run pytest -q
      - run: uv run secdigest --dry-run
      - run: uv run secdigest --dry-run weekly --preview
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-digest-previews
          path: output/samples/
