name: SecDigest shared runner
on:
  workflow_call:
    inputs:
      mode:
        default: preview
        type: string
      kind:
        required: true
        type: string
      manual:
        required: true
        type: boolean
      force_send:
        default: false
        type: boolean
      period:
        default: ''
        type: string
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - name: Check scheduled local hour before setup
        id: hour
        env:
          KIND: ${{ inputs.kind }}
          MANUAL: ${{ inputs.manual }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import os
          now = datetime.now(ZoneInfo('Europe/Amsterdam'))
          kind = os.environ['KIND']
          allowed = os.environ['MANUAL'] == 'true' or (now.hour == (7 if kind == 'daily' else 8) and (kind != 'weekly' or now.weekday() == 0))
          print('run=' + str(allowed).lower())
          PY
      - uses: actions/setup-python@v6
        if: steps.hour.outputs.run == 'true'
        with:
          python-version: '3.12'
          cache: pip
      - name: Install locked runtime dependencies
        if: steps.hour.outputs.run == 'true'
        run: |
          pip install -r requirements.txt
          pip install --no-deps .
      - name: Check configuration activation gate
        if: steps.hour.outputs.run == 'true'
        id: guard
        env:
          KIND: ${{ inputs.kind }}
          MANUAL: ${{ inputs.manual }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from secdigest.config import Config
          from secdigest.scheduling import schedule_allowed
          import os
          print('run=' + str(schedule_allowed(Config(), os.environ['KIND'], manual=os.environ['MANUAL'] == 'true')).lower())
          PY
      - name: Read database storage mode
        if: steps.guard.outputs.run == 'true'
        id: storage
        run: python scripts/ci_storage.py inspect >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        if: steps.guard.outputs.run == 'true' && steps.storage.outputs.cache_database == 'true'
        id: database
        with:
          path: data/secdigest.sqlite
          key: secdigest-db-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: secdigest-db-${{ github.ref_name }}-
      - name: Run digest
        if: steps.guard.outputs.run == 'true'
        id: digest
        env:
          OPENAI_API_KEY: ${{ inputs.mode != 'fixtures' && secrets.OPENAI_API_KEY || '' }}
          SMTP_HOST: ${{ inputs.mode == 'send' && secrets.SMTP_HOST || '' }}
          SMTP_PORT: ${{ inputs.mode == 'send' && secrets.SMTP_PORT || '' }}
          SMTP_USER: ${{ inputs.mode == 'send' && secrets.SMTP_USER || '' }}
          SMTP_PASSWORD: ${{ inputs.mode == 'send' && secrets.SMTP_PASSWORD || '' }}
          EMAIL_TO: ${{ inputs.mode == 'send' && secrets.EMAIL_TO || '' }}
          MODE: ${{ inputs.mode }}
          KIND: ${{ inputs.kind }}
          PERIOD: ${{ inputs.period }}
          FORCE_SEND: ${{ inputs.force_send }}
          CACHE_DATABASE: ${{ steps.storage.outputs.cache_database }}
        run: python scripts/workflow_digest.py
      - name: Upload preview outputs and diagnostic run log
        if: always() && (steps.digest.outcome == 'success' || steps.digest.outcome == 'failure') && inputs.mode != 'send'
        uses: actions/upload-artifact@v4
        with:
          name: secdigest-${{ inputs.kind }}-${{ inputs.mode }}-${{ github.run_id }}
          path: |
            output/
            run_log.json
          retention-days: 7
      - name: Check database size
        if: always() && steps.guard.outputs.run == 'true' && inputs.mode == 'send'
        id: size
        run: python scripts/ci_storage.py prepare >> "$GITHUB_OUTPUT"
      - uses: actions/cache/save@v4
        if: always() && steps.guard.outputs.run == 'true' && inputs.mode == 'send' && steps.size.outputs.cache_database == 'true'
        with:
          path: data/secdigest.sqlite
          key: secdigest-db-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Commit runtime artifacts, including failure status
        if: always() && steps.guard.outputs.run == 'true' && inputs.mode == 'send'
        env:
          CACHE_DATABASE: ${{ steps.size.outputs.cache_database }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          python scripts/ci_storage.py stage
          if ! git diff --cached --quiet; then
            git commit -m "chore: archive SecDigest run"
            git push
          fi
