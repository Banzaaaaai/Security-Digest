importance_points:
  critical: 100
  high: 75
  medium: 45
  low: 15
weights:
  importance: 0.6
  location: 0.15
  industry: 0.1
  practice: 0.15
# Bound the weighted score so relevance cannot outrank a higher severity tier.
priority_bands:
  critical: [85, 100]
  high: [65, 84.99]
  medium: [35, 64.99]
  low: [0, 34.99]
priority_regions:
- US
- Europe
- MEA
- Other
# Deployment applicability, not the probability or share of victims in a region.
# Profiles apply only to source-supported product security events.
exposure:
  technology_aliases:
    PHP: [PHP2Shell]
    eMudhra: [eMuhdra]
    Fortinet FortiOS: [Fortinet]
    FortiGate: [Fortinet]
    Palo Alto PAN-OS: [Palo Alto Networks]
  watch_default:
    location_floor: 85
    industry_floor: 50
    systemic: true
  worldwide_campaign:
    location_floor: 85
    industry_floor: 40
    systemic: false
  profiles:
  - name: Common web and operating-system infrastructure
    aliases: [PHP, Node.js, Windows, Windows Server, Google Chrome, Chrome, HTTP/3, QPACK]
    location_floor: 95
    industry_floor: 60
    systemic: true
  - name: Enterprise software and distribution infrastructure
    aliases: [ConnectWise, LiteLLM, GitLab, Terraform, Go modules, Oracle, Java SE, GraalVM, eMudhra, eMuhdra, PKI, TLS certificates, intermediate certificates, certificate authorities]
    location_floor: 85
    industry_floor: 50
    systemic: true
  - name: Globally available specialist and consumer software
    aliases: [Plex Media Server, Signal, RingRTC, QNAP]
    location_floor: 75
    industry_floor: 30
    systemic: false
categories:
- vulnerability
- exploitation_in_the_wild
- data_breach
- ransomware
- apt_nation_state
- supply_chain
- fraud_phishing
- regulation_policy
- law_enforcement
- research
- vendor_product
- other
rubric: '| Level | Criteria (any one is sufficient) |

  |---|---|

  | **critical** | Active in-the-wild exploitation of a `watch_tech` product or other
  widely deployed enterprise technology; new CISA KEV entry for such technology; systemic
  supply-chain compromise (major vendor, MSP/RMM tool, popular package or CI action);
  major breach or outage at an organization in a target industry in the US, Europe
  or MEA; nation-state campaign against critical infrastructure in a target region
  |

  | **high** | Critical or high CVE (CVSS ≥ 8.0) with a public PoC or vendor emergency
  patch; significant breach (millions of records or a regulated entity); new ransomware
  or phishing campaign hitting target industries; binding regulation with near-term
  effect in a target region; major law-enforcement takedown; new OT/ICS advisory for
  equipment common in energy or manufacturing |

  | **medium** | Notable vulnerability without exploitation; breach at a mid-size
  or non-target-industry organization; threat research with new TTPs; proposed regulation
  or regulator guidance; notable vendor or security product change |

  | **low** | Opinion pieces, product marketing, funding or M&A news, minor incidents
  outside the target scope, recap articles |'
title_similarity: 85
cve_title_similarity: 55
cluster_days: 7
post_dedup:
  window_hours: 48
  headline_similarity: 70
  summary_similarity: 65
  # Lower thresholds apply only with a source-supported product and compatible
  # vulnerability context. Named events and supply-chain channels add identity.
  event_headline_similarity: 55
  event_summary_similarity: 50
epss_threshold: 0.5
# Corroboration is recorded for audit; publication volume never raises severity.
independent_sources: 3
inclusion:
  min_importance: medium
  relevance: 60
cross_industry_floor: 40
