timezone: Europe/Amsterdam
database: data/secdigest.sqlite
output: output
http:
  timeout: 15
  concurrency: 8
  user_agent: SecDigest/0.1 (+https://brusiantsou.com)
  max_bytes: 20000000
models:
  classification: gpt-5.4-mini
  synthesis: gpt-5.4
  batch_size: 5
  max_tokens: 16000
  # Standard API rates checked against official model pages on 2026-10-17.
  prices_per_million:
    gpt-5.4-mini:
      input_tokens: 0.75
      cache_read_input_tokens: 0.075
      output_tokens: 4.50
    gpt-5.4:
      input_tokens: 2.50
      cache_read_input_tokens: 0.25
      output_tokens: 15.00
enrichment:
  kev_refresh_hours: 6
  epss: false
  nvd: false
  github: false
business_signals:
  enabled: false
weekly:
  window: calendar
  heatmap_min_relevance: 30
email:
  send_when_empty: true
  max_html_bytes: 90000
  table_rows: 20
  retry_count: 3
  source_health_silence_days: 3
retention:
  daily_days: 90
  database_days: 120
scheduling:
  enabled: false
  daily_hour: 7
  weekly_hour: 8
