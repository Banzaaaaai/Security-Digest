[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "secdigest"
version = "0.1.0"
description = "Configurable daily and weekly security intelligence digests"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "openai>=2.0,<3", "feedparser>=6.0.11,<7", "httpx>=0.28,<1",
  "jinja2>=3.1.6,<4", "pydantic>=2.11,<3", "PyYAML>=6.0.2,<7",
  "rapidfuzz>=3.12,<4", "tzdata>=2025.1", "filelock>=3.18,<4",
]

[project.optional-dependencies]
fulltext = ["trafilatura>=2,<3"]

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1", "respx>=0.22,<1"]

[project.scripts]
secdigest = "secdigest.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.hatch.build.targets.wheel]
packages = ["src/secdigest"]
